<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>NupicAI Flow</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <img class="brand" src="assets/logo.png" alt="NupicAI" />
        <button id="settings-open" class="icon-button" type="button" title="Ustawienia" aria-label="Ustawienia">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </header>

      <section class="capture" aria-live="polite">
        <div id="wave" class="wave" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <button id="record" class="record-button" type="button" aria-label="Rozpocznij nagrywanie">
          <span class="record-halo"></span>
          <img src="assets/mark.png" alt="" />
          <svg class="mic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3M8 22h8"/></svg>
        </button>
        <h1 id="status">Uruchamianie…</h1>
        <div id="shortcut" class="shortcut"><kbd>Ctrl</kbd><span>+</span><kbd>Alt</kbd><span>+</span><kbd>Space</kbd></div>
      </section>

      <section id="result" class="result" hidden>
        <p id="transcript"></p>
        <button id="copy" class="copy-button" type="button" title="Kopiuj" aria-label="Kopiuj transkrypcję">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        </button>
      </section>
    </main>

    <aside id="settings" class="settings" aria-hidden="true">
      <header>
        <div>
          <span>Ustawienia</span>
          <strong>NupicAI Flow</strong>
        </div>
        <button id="settings-close" class="icon-button" type="button" title="Zamknij" aria-label="Zamknij ustawienia">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </header>

      <div class="settings-scroll">
        <section id="account-authenticated" class="account-state" hidden>
          <span>Konto</span>
          <strong id="account-name"></strong>
          <button id="logout" class="secondary-button" type="button">Wyloguj</button>
        </section>

        <form id="login-form">
          <label>Serwer<input id="server-url" type="url" required spellcheck="false" /></label>
          <label>E-mail<input id="email" type="email" required autocomplete="username" /></label>
          <label>Hasło<input id="password" type="password" required autocomplete="current-password" /></label>
          <button class="primary-button" type="submit">Zaloguj</button>
        </form>

        <form id="preferences-form">
          <fieldset class="source-fieldset">
            <legend>Źródło nagrania</legend>
            <div class="segmented-control">
              <label><input type="radio" name="input-source" value="microphone" checked /><span>Mikrofon</span></label>
              <label><input type="radio" name="input-source" value="system" /><span>Dźwięk systemu</span></label>
            </div>
          </fieldset>
          <label id="microphone-device-row">Mikrofon
            <select id="input-device"><option value="">Domyślny mikrofon</option></select>
          </label>
          <label>Skrót globalny
            <span class="hotkey-row">
              <input id="hotkey" type="text" value="Ctrl+Alt+Space" readonly spellcheck="false" />
              <button id="hotkey-capture" class="capture-hotkey" type="button" title="Ustaw skrót" aria-label="Ustaw skrót">
                <svg aria-hidden="true" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M8 16h8"/></svg>
              </button>
            </span>
          </label>
          <fieldset class="source-fieldset">
            <legend>Działanie skrótu</legend>
            <div class="segmented-control activation-control">
              <label><input type="radio" name="activation-mode" value="hold" checked /><span>Przytrzymaj</span></label>
              <label><input type="radio" name="activation-mode" value="toggle" /><span>Przełącz</span></label>
              <label><input type="radio" name="activation-mode" value="continuous" /><span>Auto VAD</span></label>
            </div>
          </fieldset>
          <label class="toggle-row"><span><strong>Automatyczne wklejanie</strong><small>Wstaw tekst do aktywnego pola</small></span><input id="auto-paste" type="checkbox" /></label>
          <label class="toggle-row"><span><strong>Korekta przez AI</strong><small>Dokładniej, ale trochę wolniej</small></span><input id="polish" type="checkbox" /></label>
          <button class="primary-button" type="submit">Zapisz ustawienia</button>
        </form>
        <p id="settings-message" class="settings-message"></p>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
